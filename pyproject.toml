[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "printlab-interface"
version = "0.1.0"
description = "Sidecar orchestration layer (providers, agents, workflows) for the PrintLab workbench"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "litellm>=1.109,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]  # only for tests/browser_smoke.py; also needs Microsoft Edge or a Playwright Chromium

[project.scripts]
printlab-interface = "printlab_interface.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"printlab_interface.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

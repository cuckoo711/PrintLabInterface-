[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printlab-interface"
version = "0.1.0"
description = "Sidecar orchestration layer (providers, agents, workflows) for the PrintLab workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "litellm>=1.109,<2",
  "langgraph>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
printlab-interface = "printlab_interface.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintLabInterface</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/chat/app.css">
</head>
<body>
<header>
  <h1>PrintLabInterface</h1>
  <span id="conn" class="pill">未连接</span>
</header>

<section id="gate">
  <p>输入管理令牌后继续。令牌在 <code>data/admin_token</code> 里。它只保存在这个页面的内存中，刷新页面后需要重新输入。</p>
  <form id="gate-form" autocomplete="off">
    <label for="token">管理令牌</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" required>
    <button type="submit">连接</button>
  </form>
  <p id="gate-error" class="error" role="alert" hidden></p>
</section>

<main id="app" hidden>
  <aside>
    <label for="agent">角色</label>
    <select id="agent"></select>
    <label for="model">模型（prefix:model，留空用角色文件里的）</label>
    <input id="model" type="text" placeholder="例如 mimo:mimo-v2.6-flash" spellcheck="false">
    <button id="new-session" type="button">新会话</button>
    <h2>会话</h2>
    <ul id="sessions"></ul>
    <h2>工作流</h2>
    <label for="wf-name">工作流</label>
    <select id="wf-name"></select>
    <label for="wf-project">项目 ID（例如 P001）</label>
    <input id="wf-project" type="text" maxlength="64" autocomplete="off" spellcheck="false">
    <label for="wf-brief">说明</label>
    <textarea id="wf-brief" rows="3" maxlength="4000" autocomplete="off"></textarea>
    <button id="wf-start" type="button">开始工作流</button>
    <ul id="wf-runs"></ul>
  </aside>
  <section id="wf-panel" hidden aria-labelledby="wf-title">
    <h2 id="wf-title">工作流运行</h2>
    <p id="wf-status" role="status"></p>
    <p id="wf-detail"></p>
    <section id="wf-ask" hidden>
      <p id="wf-question"></p>
      <div id="wf-shown"></div>
      <div class="row">
        <button id="wf-yes" type="button">是，继续</button>
        <button id="wf-no" type="button">否，停止</button>
      </div>
    </section>
    <div class="row">
      <button id="wf-retry" type="button" hidden>重试这一步</button>
      <button id="wf-stop" type="button" hidden>停止</button>
      <button id="wf-close" type="button">回到聊天</button>
    </div>
    <h3>各阶段输出</h3>
    <div id="wf-outputs"></div>
  </section>
  <section id="chat">
    <div id="log" role="log" aria-live="polite"></div>
    <form id="composer" autocomplete="off">
      <label for="message" class="sr">消息</label>
      <textarea id="message" rows="3" maxlength="8000" placeholder="输入消息，Ctrl+Enter 发送" required></textarea>
      <div class="row">
        <button id="send" type="submit">发送</button>
        <button id="cancel" type="button" disabled>取消</button>
        <span id="state" aria-live="polite"></span>
      </div>
    </form>
  </section>
</main>
<script src="/chat/app.js"></script>
</body>
</html>

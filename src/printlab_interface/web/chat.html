<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintLabInterface</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/chat/app.css">
</head>
<body>
<header>
  <h1>PrintLabInterface</h1>
  <span id="conn" class="pill">未连接</span>
  <nav class="top-links" aria-label="其他页面">
    <a id="to-printlab" href="#" target="_blank" rel="noreferrer">PrintLab 工作台</a>
    <a href="/admin" target="_blank" rel="noreferrer">管理后台</a>
  </nav>
  <button id="logout" type="button" class="quiet" hidden>退出登录</button>
</header>

<section id="gate">
  <div id="setup" hidden>
    <h2>第一次使用：设置口令</h2>
    <p>口令只存在你这台电脑上，以加盐慢哈希保存，不会以明文保存。设置后这个浏览器会保持登录。</p>
    <form id="setup-form" autocomplete="off">
      <label for="setup-pass">口令（至少 10 个字符）</label>
      <input id="setup-pass" type="password" autocomplete="new-password" spellcheck="false" minlength="10" maxlength="200">
      <label for="setup-pass2">再输入一次</label>
      <input id="setup-pass2" type="password" autocomplete="new-password" spellcheck="false" maxlength="200">
      <button type="submit">设置并进入</button>
    </form>
    <p class="hint">留空两个框直接点按钮，会替你生成一个口令，只显示这一次，请自己保存好。</p>
  </div>
  <div id="generated" hidden>
    <h2>请保存好这个口令</h2>
    <p>它只会显示这一次，之后无法再找回；忘记了需要重置。</p>
    <p><code id="generated-value" class="big"></code></p>
    <button id="generated-ok" type="button">我已保存，进入</button>
  </div>
  <div id="login" hidden>
    <h2>登录</h2>
    <form id="login-form" autocomplete="off">
      <label for="login-pass">口令</label>
      <input id="login-pass" type="password" autocomplete="current-password" spellcheck="false" maxlength="200" required>
      <button type="submit">登录</button>
    </form>
  </div>
  <p id="gate-error" class="error" role="alert" hidden></p>
</section>

<main id="app" hidden>
  <aside>
    <label for="agent">角色</label>
    <select id="agent"></select>
    <label for="model">模型（prefix:model，留空用角色文件里的）</label>
    <input id="model" type="text" placeholder="例如 mimo:mimo-v2.6-flash" spellcheck="false">
    <button id="new-session" type="button">新会话</button>
    <h2>会话</h2>
    <ul id="sessions"></ul>
    <h2>工作流</h2>
    <label for="wf-name">工作流</label>
    <select id="wf-name"></select>
    <label for="wf-project">项目 ID（例如 P001）</label>
    <input id="wf-project" type="text" maxlength="64" autocomplete="off" spellcheck="false">
    <label for="wf-brief">说明</label>
    <textarea id="wf-brief" rows="3" maxlength="4000" autocomplete="off"></textarea>
    <button id="wf-start" type="button">开始工作流</button>
    <ul id="wf-runs"></ul>
  </aside>
  <section id="wf-panel" hidden aria-labelledby="wf-title">
    <h2 id="wf-title">工作流运行</h2>
    <p id="wf-status" role="status"></p>
    <p id="wf-detail"></p>
    <section id="wf-ask" hidden>
      <p id="wf-question"></p>
      <div id="wf-shown"></div>
      <div class="row">
        <button id="wf-yes" type="button">是，继续</button>
        <button id="wf-no" type="button">否，停止</button>
      </div>
    </section>
    <div class="row">
      <button id="wf-retry" type="button" hidden>重试这一步</button>
      <button id="wf-stop" type="button" hidden>停止</button>
      <button id="wf-close" type="button">回到聊天</button>
    </div>
    <h3>各阶段输出</h3>
    <div id="wf-outputs"></div>
  </section>
  <section id="chat">
    <div id="log" role="log" aria-live="polite"></div>
    <form id="composer" autocomplete="off">
      <label for="message" class="sr">消息</label>
      <textarea id="message" rows="3" maxlength="8000" placeholder="输入消息，Ctrl+Enter 发送" required></textarea>
      <div class="row">
        <button id="send" type="submit">发送</button>
        <button id="cancel" type="button" disabled>取消</button>
        <span id="state" aria-live="polite"></span>
      </div>
    </form>
  </section>
</main>
<script src="/chat/login.js"></script>
<script src="/chat/app.js"></script>
</body>
</html>
